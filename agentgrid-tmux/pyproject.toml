[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "agentgrid-tmux"
version = "0.1.0"
description = "tmuxio: standalone tmux pane discovery, inspection, reading, writing, and streaming for AgentGrid."
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
agentgrid-tmux = "cli.main:main"
tmuxio = "cli.main:main"

[tool.setuptools]
packages = ["tmuxio", "cli"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
  "e2e: tests that require a local tmux binary and isolated tmux server",
]

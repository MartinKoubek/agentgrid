[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "agentgrid-policy"
version = "0.1.0"
description = "agentgrid-policy: explicit allow, ask-user, deny action decisions."
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
agentgrid-policy = "agentgrid_policy.cli:main"

[tool.setuptools]
packages = ["agentgrid_policy"]

[tool.pytest.ini_options]
testpaths = ["tests"]

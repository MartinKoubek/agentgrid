[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "agentgrid-recovery"
version = "0.1.0"
description = "agentgrid-recovery: reconcile persisted AgentGrid state with live runtime state."
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
agentgrid-recovery = "agentgrid_recovery.cli:main"

[tool.setuptools]
packages = ["agentgrid_recovery"]

[tool.pytest.ini_options]
testpaths = ["tests"]

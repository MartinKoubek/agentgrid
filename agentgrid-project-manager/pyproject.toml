[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "agentgrid-project-manager"
version = "0.1.0"
description = "agentgrid-project-manager: standalone project identity and workspace metadata store."
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
agentgrid-project-manager = "agentgrid_project_manager.cli:main"

[tool.setuptools]
packages = ["agentgrid_project_manager"]

[tool.pytest.ini_options]
testpaths = ["tests"]

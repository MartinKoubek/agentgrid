[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "agentgrid-cross-context"
version = "0.1.0"
description = "agentgrid-cross-context: associate external events with AgentGrid projects."
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
agentgrid-cross-context = "agentgrid_cross_context.cli:main"

[tool.setuptools]
packages = ["agentgrid_cross_context"]

[tool.pytest.ini_options]
testpaths = ["tests"]

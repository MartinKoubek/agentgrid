[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "agentgrid-persistence"
version = "0.1.0"
description = "agentgrid-persistence: standalone SQLite JSON document store for AgentGrid module state."
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
agentgrid-persistence = "agentgrid_persistence.cli:main"

[tool.setuptools]
packages = ["agentgrid_persistence"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "agentgrid-project-context"
version = "0.1.0"
description = "agentgrid-project-context: compact structured project context builder."
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
agentgrid-project-context = "agentgrid_project_context.cli:main"

[tool.setuptools]
packages = ["agentgrid_project_context"]

[tool.pytest.ini_options]
testpaths = ["tests"]

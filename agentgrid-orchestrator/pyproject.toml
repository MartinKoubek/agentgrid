[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "agentgrid-orchestrator"
version = "0.1.0"
description = "agentgrid-orchestrator: high-level coordination boundary for AgentGrid."
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
agentgrid-orchestrator = "agentgrid_orchestrator.cli:main"

[tool.setuptools]
packages = ["agentgrid_orchestrator"]

[tool.pytest.ini_options]
testpaths = ["tests"]

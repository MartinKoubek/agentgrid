[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "agentgrid-execution"
version = "0.1.0"
description = "agentgrid-execution: generic build, test, deploy, and validation workflow runner."
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
agentgrid-execution = "agentgrid_execution.cli:main"

[tool.setuptools]
packages = ["agentgrid_execution"]

[tool.pytest.ini_options]
testpaths = ["tests"]

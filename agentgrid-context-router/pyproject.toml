[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "agentgrid-context-router"
version = "0.1.0"
description = "agentgrid-context-router: request routing decisions from project context."
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
agentgrid-context-router = "agentgrid_context_router.cli:main"

[tool.setuptools]
packages = ["agentgrid_context_router"]

[tool.pytest.ini_options]
testpaths = ["tests"]

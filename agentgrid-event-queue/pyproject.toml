[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "agentgrid-event-queue"
version = "0.1.0"
description = "agentgrid-event-queue: standalone persistent priority event queue for AgentGrid."
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
agentgrid-event-queue = "agentgrid_event_queue.cli:main"

[tool.setuptools]
packages = ["agentgrid_event_queue"]

[tool.pytest.ini_options]
testpaths = ["tests"]

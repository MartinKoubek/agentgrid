[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "agentgrid-shell-logger"
version = "0.1.0"
description = "agentgrid-shell-logger: standalone shell command activity logger for AgentGrid."
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
agentgrid-shell-logger = "agentgrid_shell_logger.cli:main"

[tool.setuptools]
packages = ["agentgrid_shell_logger"]

[tool.pytest.ini_options]
testpaths = ["tests"]
